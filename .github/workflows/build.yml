name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kabel-strazh-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS (simulator)
        run: |
          xcodebuild \
            -project ios/KabelStrazh.xcodeproj \
            -scheme KabelStrazh \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Pack .app
        run: |
          APP=$(find ios/build -name "KabelStrazh.app" -type d | head -n 1)
          test -n "$APP"
          mkdir -p ios/dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" ios/dist/kabel-strazh-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kabel-strazh-ios-simulator
          path: ios/dist/kabel-strazh-ios-simulator.zip
          if-no-files-found: error
